## Structure: outermost layer is survey (e.g., DES, LSST, ROMAN, etc.) Inner layer indicates data file type (e.g., DUMP, SIM, DATA).
# The subscript indicates the SN type (e.g., IA, CC, etc.) ALL indicates a mixture of SN types.

FIT_OPTIONS:
  RATE_FUNCTION: power_law

SDSS:
  FIT_OPTIONS:
    RATE_FUNC: power_law
    RATE_PARAMS: 2.27E-5, 1.7
    Z_BINS: 7 # 8
    MIN_Z: 0.05 # 0.05
    MAX_Z: 0.35
    CC_ARE_SEPARATE: false
    F_NORM: 0.02
  CUTS:
    x1: -3, 3
    c: -0.3, 0.3
    FITPROB: 0.001, 1000
  DUMP_ALL:
    PATH: /scratch/midway2/rkessler/PIPPIN_OUTPUT/CFM-SDSS-1016MASK-ALLRUNS/1_SIM/SDSS_BCOR/PIP_CFM-SDSS-1016MASK-ALLRUNS_SDSS_BCOR/PIP_CFM-SDSS-1016MASK-ALLRUNS_SDSS_BCOR.DUMP.gz
    ZCOL: GENZ
    SNTYPECOL: GENTYPE
    IA_VALS:
      - 1
  SIM_ALL:
    PATH: /scratch/midway2/rkessler/PIPPIN_OUTPUT/CFM-SDSS-1016MASK-FITTEST/5_MERGE/MERGE_SDSSFIT_SDSS_BCOR/output/PIP_CFM-SDSS-1016MASK-ALLRUNS_SDSS_BCOR/FITOPT004.FITRES.gz
    ZCOL: zHD
    SNTYPECOL: SIM_GENTYPE
    IA_VALS:
      - 1
  DATA_ALL:
    PATH: /scratch/midway2/rkessler/PIPPIN_OUTPUT/CFM-SDSS-1016MASK-FITTEST/5_MERGE/MERGE_SDSSFIT_DATASDSS/output/SDSS_allCandidates+BOSS_PK20MSK/FITOPT004.FITRES.gz
    ZCOL: zHD

DES:
  FIT_OPTIONS:
    RATE_FUNC: power_law
    RATE_PARAMS: 2.27E-5, 1.7
    Z_BINS: 10
    MIN_Z: 0.1
    MAX_Z: 0.9
    F_NORM: 0.02
    AREA_FRAC: 0.826


# Dump data is from when I synced up to SDSS
# LCFITTEST was a later run I did where I varied different LC Fit choices on the same data.

  CUTS:
    x1: -3, 3
    c: -0.3, 0.3
    FITPROB: 0.001, 1000
  DUMP_IA:
    PATH: /scratch/midway2/rkessler/PIPPIN_OUTPUT/D5YR_RATEPZ_SDSSSYNC_ANALYSIS_PC/1_SIM/DESIA_NOMINAL/PIP_D5YR_RATEPZ_SDSSSYNC_BCOR_PC_DESIA_NOMINAL/PIP_D5YR_RATEPZ_SDSSSYNC_BCOR_PC_DESIA_NOMINAL.DUMP.gz
  SIM_IA:
    PATH: /scratch/midway2/rkessler/PIPPIN_OUTPUT/D5YR_RATEPZ_SDSSSYNC_LCFITTEST/5_MERGE/MERGE_D5_DESIA_NOMINAL/output/PIP_D5YR_RATEPZ_SDSSSYNC_BCOR_PC_DESIA_NOMINAL/FITOPT000.FITRES.gz
    ZCOL: zHD

  DATA_ALL:
    PATH:
      - /scratch/midway2/rkessler/PIPPIN_OUTPUT/D5YR_RATEPZ_SDSSSYNC_LCFITTEST/5_MERGE/MERGE_Dsys_DATADESSMP/output/DES-SN5YR_DES/FITOPT000.FITRES.gz
    ZCOL: zHD


  DUMP_CC:
    PATH: /scratch/midway2/rkessler/PIPPIN_OUTPUT/D5YR_RATEPZ_SDSSSYNC_ANALYSIS_PC/1_SIM/DESCC_NOMINAL/PIP_D5YR_RATEPZ_SDSSSYNC_BCOR_PC_DESCC_NOMINAL/PIP_D5YR_RATEPZ_SDSSSYNC_BCOR_PC_DESCC_NOMINAL.DUMP.gz
  # change the below to a different sim file
  SIM_CC:
    PATH: /scratch/midway2/rkessler/PIPPIN_OUTPUT/D5YR_RATEPZ_SDSSSYNC_LCFITTEST/5_MERGE/MERGE_D5_CC_DESCC_NOMINAL/output/PIP_D5YR_RATEPZ_SDSSSYNC_BCOR_PC_DESCC_NOMINAL/FITOPT000.FITRES.gz
    ZCOL: zHD
